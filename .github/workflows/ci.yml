name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Builds the Kurz commit the README names, in the image that commit's own CI job runs in, then the server, and runs
  # the curl, aws-cli and rclone checks against it.
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The example credentials of AWS's documentation; the server and the three scripts read the same two variables.
      KURZ_S3_ACCESS_KEY: AKIDEXAMPLE
      KURZ_S3_SECRET_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The Kurz commit the README names
        id: kurz
        run: |
          sha=$(sed -n 's/^Kurz commit: `\([0-9a-f]\{40\}\)`$/\1/p' README.md)
          if [ "$(printf '%s' "$sha" | grep -c .)" != 1 ]; then
            echo "README.md names no single Kurz commit in a line 'Kurz commit: \`<40 hex digits>\`'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: SymoHTL/Kurz
          ref: ${{ steps.kurz.outputs.sha }}
          path: kurz
          persist-credentials: false
      - name: Build the compiler and the server
        run: |
          image=$(sed -n 's/^ *image: \(ghcr\.io\/symohtl\/kurz-ci@sha256:[0-9a-f]\{64\}\)$/\1/p' kurz/.github/workflows/gates.yml)
          if [ "$(printf '%s' "$image" | grep -c .)" != 1 ]; then
            echo "kurz/.github/workflows/gates.yml names no single kurz-ci image by its digest"
            exit 1
          fi
          docker run --rm -v "$PWD:/w" -w /w "$image" sh -c '
            dotnet build kurz/compiler/Kurz/Kurz.csproj -c Release -p:RestoreLockedMode=true &&
            dotnet kurz/compiler/Kurz/bin/Release/net10.0/kurz.dll build --release s3.kz -o s3'
      - name: Start the server
        id: start
        run: |
          KURZ_S3_ROOT="$RUNNER_TEMP/root" nohup ./s3 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 50); do
            if grep -q '^listening' "$RUNNER_TEMP/server.log"; then
              exit 0
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - name: curl
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          curl --version | head -1
          sh test/curl.sh
      - name: aws-cli
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: sh test/awscli.sh
      - name: rclone
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: sh test/rclone.sh
      - name: The server's output
        if: ${{ always() }}
        run: cat "$RUNNER_TEMP/server.log" || true
